<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Menu</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #334155;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .lang-switch {
            display: flex;
            gap: 8px;
        }

        .lang-btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--accent-color);
            color: #0f172a;
        }

        .menu-category {
            margin-bottom: 24px;
        }

        .category-title {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: #cbd5e1;
            border-left: 4px solid var(--accent-color);
            padding-left: 8px;
        }

        .item {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info h3 {
            margin: 0 0 6px 0;
            font-size: 1rem;
        }

        .item-info p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .item-price {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.05rem;
            white-space: nowrap;
            margin-left: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="title">Меню отеля</h1>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLanguage('ru')">RU</button>
            <button class="lang-btn" onclick="setLanguage('uz')">UZ</button>
            <button class="lang-btn" onclick="setLanguage('kk')">KZ</button>
        </div>
    </header>

    <div class="menu-category">
        <div class="category-title" id="cat-breakfast">Завтраки</div>
        
        <div class="item">
            <div class="item-info">
                <h3 id="item1-title">Континентальный завтрак</h3>
                <p id="item1-desc">Круассан, джем, масло, свежий кофе или чай</p>
            </div>
            <div class="item-price">45 000 UZS</div>
        </div>

        <div class="item">
            <div class="item-info">
                <h3 id="item2-title">Омлет с сыром и зеленью</h3>
                <p id="item2-desc">Подается со свежим тостом и микс-салатом</p>
            </div>
            <div class="item-price">38 000 UZS</div>
        </div>
    </div>

    <div class="menu-category">
        <div class="category-title" id="cat-drinks">Напитки</div>
        
        <div class="item">
            <div class="item-info">
                <h3 id="item3-title">Кофе Капучино</h3>
                <p id="item3-desc">Свежесваренный эспрессо с пышной молочной пеной</p>
            </div>
            <div class="item-price">25 000 UZS</div>
        </div>
    </div>
</div>

<script>
    const translations = {
        ru: {
            title: "Меню отеля",
            catBreakfast: "Завтраки",
            catDrinks: "Напитки",
            item1Title: "Континентальный завтрак",
            item1Desc: "Круассан, джем, масло, свежий кофе или чай",
            item2Title: "Омлет с сыром и зеленью",
            item2Desc: "Подается со свежим тостом и микс-салатом",
            item3Title: "Кофе Капучино",
            item3Desc: "Свежесваренный эспрессо с пышной молочной пеной"
        },
        uz: {
            title: "Mehmonxona menyusi",
            catBreakfast: "Nonushta",
            catDrinks: "Ichimliklar",
            item1Title: "Kontinental nonushta",
            item1Desc: "Kruassan, jem, sariyog', yangi kofe yoki choy",
            item2Title: "Pishloq va ko'katli omlet",
            item2Desc: "Tost va miks-salat bilan tortiladi",
            item3Title: "Kappuchino kofesi",
            item3Desc: "Yangi damlangan espresso va sut ko'pigi"
        },
        kk: {
            title: "Қонақүй мәзірі",
            catBreakfast: "Танғы ас",
            catDrinks: "Сусындар",
            item1Title: "Континенталды таңғы ас",
            item1Desc: "Круассан, джем, сары май, жаңа демделген кофе немесе шай",
            item2Title: "Ірімшік пен шөптер қосылған омлет",
            item2Desc: "Тоб пен аралас салатпен ұсынылады",
            item3Title: "Капучино кофесі",
            item3Desc: "Жаңа демделген эспрессо және сүт көбігі"
        }
    };

    function setLanguage(lang) {
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const t = translations[lang];
        document.getElementById('title').textContent = t.title;
        document.getElementById('cat-breakfast').textContent = t.catBreakfast;
        document.getElementById('cat-drinks').textContent = t.catDrinks;
        document.getElementById('item1-title').textContent = t.item1Title;
        document.getElementById('item1-desc').textContent = t.item1Desc;
        document.getElementById('item2-title').textContent = t.item2Title;
        document.getElementById('item2-desc').textContent = t.item2Desc;
        document.getElementById('item3-title').textContent = t.item3Title;
        document.getElementById('item3-desc').textContent = t.item3Desc;
    }
</script>

</body>
</html>
