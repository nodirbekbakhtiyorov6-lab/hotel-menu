<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Tower Hotel & Resort</title>
    <style>
        :root {
            --bg-body: #0b0f17;
            --card-bg: rgba(22, 28, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --btn-gray: rgba(255, 255, 255, 0.06);
            --accent-gold: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.25);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --radius-main: 28px;
            --radius-card: 20px;
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --btn-gray: #f1f5f9;
            --accent-gold: #d97706;
            --accent-glow: rgba(217, 119, 6, 0.15);
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 120px 0;
            overflow-x: hidden;
        }

        /* Премиум Баннер */
        .hero-header {
            position: relative;
            height: 200px;
            background: linear-gradient(180deg, rgba(11, 15, 23, 0.2) 0%, var(--bg-body) 100%), 
                        url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1000&q=80') center/cover no-repeat;
            padding: calc(env(safe-area-inset-top) + 16px) 20px 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .top-controls {
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .control-btn {
            background: rgba(11, 15, 23, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .control-btn option { background: #0b0f17; color: #fff; }

        .room-badge {
            background: linear-gradient(135deg, #ffffff, #e2e8f0);
            color: #0b0f17;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            letter-spacing: 0.5px;
        }

        .main-container {
            position: relative;
            background-color: var(--bg-body);
            border-top-left-radius: var(--radius-main);
            border-top-right-radius: var(--radius-main);
            margin-top: -30px;
            padding: 24px 20px;
            z-index: 2;
        }

        .hotel-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .hotel-logo {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .hotel-name {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Главная сетка услуг */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .grid-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-card);
            padding: 22px 16px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .grid-card:active { transform: scale(0.96); }

        .grid-card.featured {
            grid-row: span 2;
            background: linear-gradient(165deg, var(--card-bg), rgba(245, 158, 11, 0.08));
            border-color: rgba(245, 158, 11, 0.3);
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        .svg-icon {
            width: 34px;
            height: 34px;
            fill: none;
            stroke: var(--accent-gold);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 12px;
            filter: drop-shadow(0 2px 8px var(--accent-glow));
        }

        .featured .svg-icon { width: 52px; height: 52px; }
        .card-title { font-size: 15px; font-weight: 700; }

        /* Экран Меню */
        .sub-screen {
            display: none;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            background: var(--btn-gray);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Теги Категорий */
        .category-tags {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 14px;
            margin-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .category-tags::-webkit-scrollbar { display: none; }

        .tag-btn {
            background: var(--btn-gray);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }

        .tag-btn.active {
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* Карточки Блюд */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img {
            width: 100%;
            height: 140px;
            border-radius: 16px;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .product-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
            line-height: 1.3;
        }

        .product-price-btn {
            background: var(--btn-gray);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .product-price-btn:active {
            transform: scale(0.96);
            background: var(--accent-gold);
            color: #fff;
        }

        .comment-box {
            margin-top: 24px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            padding: 14px;
        }

        textarea {
            width: 100%;
            height: 60px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            resize: none;
            font-family: inherit;
        }

        /* Нижняя Панель */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(11, 15, 23, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 20px calc(env(safe-area-inset-bottom) + 16px) 20px;
            border-top: 1px solid var(--card-border);
            z-index: 100;
        }

        .btn-submit {
            background: linear-gradient(135deg, #ffffff, #e2e8f0);
            color: #0b0f17;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
        }

        /* Корзина Модалка */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            z-index: 999;
            display: none;
            align-items: flex-end;
        }

        .modal-content {
            background: var(--bg-body);
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            width: 100%;
            max-height: 85vh;
            padding: 28px 24px calc(env(safe-area-inset-bottom) + 28px) 24px;
            overflow-y: auto;
            border-top: 1px solid var(--card-border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title { font-size: 22px; font-weight: 800; }
        .close-btn { background: var(--btn-gray); border: none; color: var(--text-muted); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; font-weight: 700; cursor: pointer; }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .cart-item-name { font-size: 15px; font-weight: 700; }
        .cart-item-price { font-size: 13px; color: var(--accent-gold); font-weight: 600; margin-top: 2px; }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qty-btn {
            background: var(--btn-gray);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: none;
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="hero-header">
        <div class="top-controls">
            <button class="control-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
            <select class="control-btn" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="en">EN</option>
                <option value="ru">RU</option>
                <option value="uz">UZ</option>
            </select>
        </div>
        <div class="room-badge" id="roomDisplay">Room: --</div>
    </div>

    <div class="main-container">
        <div class="hotel-brand">
            <div class="hotel-logo">T</div>
            <div class="hotel-name">The Tower</div>
        </div>

        <!-- ГЛАВНЫЙ ЭКРАН -->
        <div id="screen-main" class="services-grid">
            <div class="grid-card" onclick="showToast('Services coming soon', 'ℹ️')">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                <div class="card-title" data-i18n="services">Services</div>

            <div class="grid-card featured" onclick="openMenuScreen()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                <div class="card-title" data-i18n="menu">Menu</div>
            </div>

            <div class="grid-card" onclick="sendDirectRequest('Запрос на вызов ресепшн', '📞 Ресепшн вызван!')">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                <div class="card-title" data-i18n="reception">Reception</div>

            <div class="grid-card" onclick="sendDirectRequest('Запрос на заказ такси', '🚖 Такси запрошено!')">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 12 10s-6.7.6-8.5 1.1C2.7 11.3 2 12.1 2 13v3c0 .6.4 1 1 1h2m2 0a2 2 0 1 0 4 0 2 2 0 0 0-4 0m8 0a2 2 0 1 0 4 0 2 2 0 0 0-4 0M5 10l2-5h10l2 5"/></svg>
                <div class="card-title" data-i18n="taxi">Call a Taxi</div>
            </div>

            <div class="grid-card" onclick="sendDirectRequest('Сообщение о проблеме в номерах', '⚠️ Сигнал отправлен')">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4m0 4h.01"/></svg>
                <div class="card-title" data-i18n="report">Report Problem</div>
            </div>
        </div>

        <!-- ЭКРАН МЕНЮ ЕДЫ -->
        <div id="screen-menu" class="sub-screen">
            <button class="back-btn" onclick="openMainScreen()">← <span data-i18n="back">Back</span></button>

            <div class="category-tags">
                <button class="tag-btn active" onclick="switchCategory('Soup', this)">Soup</button>
                <button class="tag-btn" onclick="switchCategory('Salad', this)">Salad</button>
                <button class="tag-btn" onclick="switchCategory('Pastas', this)">Pastas</button>
                <button class="tag-btn" onclick="switchCategory('Main', this)">Main course</button>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Карточки закроются скриптом -->
            </div>

            <div class="comment-box">
                <textarea id="commentInput" placeholder="Add comment or special request..."></textarea>
            </div>
        </div>
    </div>

    <div class="cart-bar">
        <button class="btn-submit" id="orderBtn" onclick="handleCartClick()" data-i18n="cart_empty">View Cart</button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО KОРЗИНЫ -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" data-i18n="your_cart">Your Cart</div>
                <button class="close-btn" onclick="closeCartModal()">✕</button>
            </div>
            <div id="cartItemsList"></div>
            <div style="margin-top: 24px;">
                <button class="btn-submit" id="sendOrderBtn" onclick="sendOrder()" data-i18n="send_order">Send Order</button>
            </div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8932643761:AAH80RD5-i-P1sksa9t-3WS368fNUdeE0ZM";
        const CHAT_ID = "-1003768428141";

        const menuData = {
            Soup: [
                { id: 1, name: "Chicken soup", price: 48000, img: "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=600&q=80" },
                { id: 2, name: "Pumpkin Soup", price: 50000, img: "https://images.unsplash.com/photo-1476718406336-bb5a9690ee2a?auto=format&fit=crop&w=600&q=80" },
                { id: 3, name: "Mushroom Soup", price: 52000, img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=600&q=80" },
                { id: 4, name: "Ramen Soup", price: 65000, img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=600&q=80" }
            ],
            Salad: [
                { id: 5, name: "Caesar Salad", price: 55000, img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=600&q=80" },
                { id: 6, name: "Greek Salad", price: 45000, img: "https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=600&q=80" }
            ],
            Pastas: [
                { id: 7, name: "Carbonara", price: 68000, img: "https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=600&q=80" },
                { id: 8, name: "Bolognese", price: 62000, img: "https://images.unsplash.com/photo-1621996346565-e3d5d6281288?auto=format&fit=crop&w=600&q=80" }
            ],
            Main: [
                { id: 9, name: "Beef Steak", price: 120000, img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80" },
                { id: 10, name: "Grilled Salmon", price: 110000, img: "https://images.unsplash.com/photo-1467003909585-2f8a72700288?auto=format&fit=crop&w=600&q=80" }
            ]
        };

        let cart = [];
        let roomNum = "101";
        let currentLang = "en";

        const i18n = {
            en: { services: "Services", menu: "Menu", reception: "Reception", taxi: "Call a Taxi", report: "Report Problem", back: "Back", cart_empty: "View Cart", placeholder: "Add comment or special request...", your_cart: "Your Cart", send_order: "Send Order" },
            ru: { services: "Услуги", menu: "Меню", reception: "Ресепшн", taxi: "Заказать такси", report: "Проблема", back: "Назад", cart_empty: "Корзина", placeholder: "Добавьте комментарий к заказу...", your_cart: "Ваша Корзина", send_order: "Отправить заказ" },
            uz: { services: "Xizmatlar", menu: "Menu", reception: "Qabulxona", taxi: "Taksi chaqirish", report: "Muammo", back: "Orqaga", cart_empty: "Savat", placeholder: "Izoh yoki maxsus so'rov qoldiring...", your_cart: "Sizning Savatingiz", send_order: "Buyurtmani yuborish" }
        };

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('room')) {
                roomNum = urlParams.get('room');
            }
            document.getElementById('roomDisplay').innerText = `Room: ${roomNum}`;
            renderProducts('Soup');
        };

        function showToast(message, icon = "✅") {
            let toast = document.getElementById('customToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'customToast';
                toast.style.cssText = `
                    position: fixed;
                    top: 20px;
                    left: 50%;
                    transform: translateX(-50%) translateY(-100px);
                    background: rgba(22, 28, 38, 0.95);
                    backdrop-filter: blur(16px);
                    -webkit-backdrop-filter: blur(16px);
                    color: #fff;
                    padding: 14px 24px;
                    border-radius: 30px;
                    border: 1px solid rgba(255, 255, 255, 0.15);
                    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                    font-size: 14px;
                    font-weight: 700;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    z-index: 9999;
                    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                    pointer-events: none;
                `;
                document.body.appendChild(toast);
            }

            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            toast.style.transform = 'translateX(-50%) translateY(0)';

            setTimeout(() => {
                toast.style.transform = 'translateX(-50%) translateY(-100px)';
            }, 2500);
        }

        function switchCategory(catName, btnEl) {
            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderProducts(catName);
        }

        function renderProducts(catName) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            const items = menuData[catName] || [];

            items.forEach(item => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img class="product-img" src="${item.img}" alt="${item.name}">
                            <div class="product-title">${item.name}</div>
                        </div>
                        <button class="product-price-btn" onclick="addToCart('${item.name}', ${item.price})">
                            ${item.price.toLocaleString()} UZS
                        </button>
                    </div>
                `;
            });
        }

        function addToCart(name, price) {
            const existing = cart.find(i => i.name === name);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCartBar();
            showToast(`${name} добавлен`, "🛒");
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartBar();
            renderCartModal();
            if (cart.length === 0) closeCartModal();
        }

        function updateQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartBar();
            renderCartModal();
            if (cart.length === 0) closeCartModal();
        }

        function updateCartBar() {
            const btn = document.getElementById('orderBtn');
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            if (totalCount === 0) {
                btn.innerText = i18n[currentLang].cart_empty;
            } else {
                btn.innerText = `View Cart (${totalCount}) — ${totalPrice.toLocaleString()} UZS`;
            }
        }

        function handleCartClick() {
            if (cart.length === 0) {
                showToast(currentLang === 'ru' ? "Корзина пуста" : "Cart is empty", "⚠️");
                return;
            }
            renderCartModal();
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCartModal() {
            document.getElementById('cartModal').style.display = 'none';
        }

        function renderCartModal() {
            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';

            cart.forEach((item, idx) => {
                list.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">${(item.price * item.qty).toLocaleString()} UZS</div>
                        </div>
                        <div class="cart-item-controls">
                            <button class="qty-btn" onclick="updateQty(${idx}, -1)">-</button>
                            <span style="font-weight: 700; font-size: 14px;">${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${idx}, 1)">+</button>
                            <button class="delete-btn" onclick="removeFromCart(${idx})">✕</button>
                        </div>
                    </div>
                `;
            });
        }

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.innerText = i18n[lang][key];
            });
            document.getElementById('commentInput').placeholder = i18n[lang].placeholder;
            updateCartBar();
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.innerText = '☀️';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.innerText = '🌙';
            }
        }

        function openMenuScreen() {
            document.getElementById('screen-main').style.display = 'none';
            document.getElementById('screen-menu').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function openMainScreen() {
            document.getElementById('screen-menu').style.display = 'none';
            document.getElementById('screen-main').style.display = 'grid';
            window.scrollTo(0, 0);
        }

        async function translateToRussian(text) {
            if (!text) return "";
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                return data[0].map(i => i[0]).join('');
            } catch { return text; }
        }

        async function sendDirectRequest(type, successToast) {
            const msg = `🔔 <b>НОВЫЙ ВЫЗОВ</b>\n🏨 <b>Номер:</b> ${roomNum}\n📌 <b>Тип:</b> ${type}`;
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'HTML' })
                });
                showToast(successToast, "📲");
            } catch {
                showToast("Ошибка отправки", "❌");
            }
        }

        async function sendOrder() {
            if (cart.length === 0) return;

            const sendBtn = document.getElementById('sendOrderBtn');
            sendBtn.disabled = true;
            sendBtn.innerText = "Sending...";

            const comment = document.getElementById('commentInput').value.trim();
            let msg = `🍽 <b>НОВЫЙ ЗАКАЗ В НОМЕР</b>\n🏨 <b>Номер:</b> ${roomNum}\n\n📋 <b>Состав заказа:</b>\n`;

            let total = 0;
            cart.forEach((item, idx) => {
                const itemTotal = item.price * item.qty;
                msg += `${idx + 1}. ${item.name} x${item.qty} — ${itemTotal.toLocaleString()} UZS\n`;
                total += itemTotal;
            });

            msg += `\n💰 <b>Итого:</b> ${total.toLocaleString()} UZS\n`;

            if (comment) {
                const tr = await translateToRussian(comment);
                msg += `💬 <b>Комментарий:</b> ${comment}\n🇷🇺 <b>Перевод:</b> <i>${tr}</i>\n`;
            }

            msg += `\n⏳ <b>Статус:</b> Ожидает подтверждения`;

            const payload = {
                chat_id: CHAT_ID,
                text: msg,
                parse_mode: 'HTML',
                reply_markup: {
                    inline_keyboard: [
                        [
                            { text: "✅ Принять заказ", callback_data: "accept_order" }
                        ]
                    ]
                }
            };

            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const resData = await res.json();
                if (resData.ok) {
                    showToast("Заказ успешно отправлен!", "🎉");
                    cart = [];
                    document.getElementById('commentInput').value = '';
                    closeCartModal();
                    updateCartBar();
                } else {
                    showToast("Ошибка бот-сервера", "❌");
                }
            } catch (err) {
                showToast("Ошибка сети", "❌");
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = i18n[currentLang].send_order;
            }
        }
    </script>
</body>
</html>
