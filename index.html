<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Запрет кеширования -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>The Tower Hotel</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Шрифты и Стили -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
            padding-bottom: 90px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-submit {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
            transition: background 0.2s;
            z-index: 100;
        }

        .btn-submit:active {
            background: #1d4ed8;
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏨 The Tower Hotel</h1>
        <p>Оформление заказа в номер</p>
    </div>

    <form id="orderForm">
        <div class="form-group">
            <label for="room">Номер комнаты / Апартаменты</label>
            <input type="text" id="room" placeholder="Например: 402" required>
        </div>

        <div class="form-group">
            <label for="category">Категория услуги</label>
            <select id="category" required>
                <option value="Доставка еды">🍽 Доставка еды / Напитков</option>
                <option value="Уборка номера">🧹 Уборка / Смена белья</option>
                <option value="Техническая помощь">🛠 Техническая помощь</option>
                <option value="Другое">❓ Другой запрос</option>
            </select>
        </div>

        <div class="form-group">
            <label for="details">Детали заказа</label>
            <textarea id="details" rows="3" placeholder="Укажите подробности заказа..." required></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Отправить заказ</button>
    </form>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        const form = document.getElementById('orderForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const room = document.getElementById('room').value.trim();
            const category = document.getElementById('category').value;
            const details = document.getElementById('details').value.trim();

            if (!room || !details) {
                alert('Пожалуйста, заполните все поля!');
                return;
            }

            // Блокируем кнопку на время отправки
            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';

            // Формируем красивый текст для сообщения в Telegram
            const user = tg.initDataUnsafe?.user;
            const clientName = user ? `${user.first_name || ''} ${user.last_name || ''}`.trim() : 'Гость';
            const username = user?.username ? `@${user.username}` : 'Не указан';

            const messageText = `📦 <b>НОВЫЙ ЗАКАЗ!</b>\n\n` +
                                `🏨 <b>Комната:</b> ${room}\n` +
                                `📋 <b>Категория:</b> ${category}\n` +
                                `📝 <b>Детали:</b> ${details}\n\n` +
                                `👤 <b>Заказчик:</b> ${clientName} (${username})\n` +
                                `⏳ Статус: Ожидает доставки`;

            try {
                // Отправляем данные на Netlify Function
                const response = await fetch('/.netlify/functions/bot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'send_order',
                        text: messageText
                    })
                });

                if (response.ok) {
                    tg.showAlert('✅ Ваш заказ успешно отправлен!');
                    tg.close(); // Закрываем WebApp после успешной отправки
                } else {
                    throw new Error(' Ошибка при отправке заказа');
                }
            } catch (err) {
                alert('Ошибка отправки: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = 'Отправить заказ';
            }
        });
    </script>
</body>
</html>
